name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build --configuration debug 2>&1

      - name: Build (release)
        run: swift build --configuration release 2>&1

      - name: Run tests
        run: swift test 2>&1
